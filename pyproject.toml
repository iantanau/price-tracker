[project]
name = "price-tracker"
version = "0.1.0"
description = "Price Intelligence Platform - Phase 1 MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "soupsieve>=2.5",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.coverage.run]
source = ["app", "clients", "config", "data", "models", "monitors", "notifiers", "parsers", "services", "storage", "utils"]

[tool.setuptools.packages.find]
include = [
    "clients",
    "config",
    "models",
    "parsers",
    "storage",
    "monitors",
    "services",
    "notifiers",
]