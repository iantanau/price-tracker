<!doctype html>
<html lang="en">
<head><title>Embedded JSON Product</title></head>
<body>
  <div id="root" class="spa-root">
    <!-- Rendered by JavaScript -->
  </div>
  <script>
    window.__PRELOADED_STATE__ = {
      "entity": {
        "products": {
          "SKU-12345": {
            "name": "Example Product",
            "prices": {
              "base": {
                "currency": {"code": "AUD", "symbol": "$"},
                "value": 99.95
              },
              "promo": {
                "currency": {"code": "AUD", "symbol": "$"},
                "value": 79.95
              }
            }
          }
        }
      }
    };
  </script>
  <script>
    window.__OTHER_STATE__ = {"nested": {"price": "123.45"}};
  </script>
</body>
</html>
